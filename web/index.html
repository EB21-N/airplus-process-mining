<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air+</title>
<link rel="preload" href="/vendor/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d90016'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23fff' stroke-width='4'/%3E%3C/svg%3E">
<script type="importmap">
{"imports":{"three":"/vendor/three/three.module.min.js","three/addons/controls/OrbitControls.js":"/vendor/three/OrbitControls.js","three/addons/loaders/GLTFLoader.js":"/vendor/three/GLTFLoader.js","three/addons/utils/BufferGeometryUtils.js":"/vendor/three/BufferGeometryUtils.js"}}
</script>
</head>
<body>
<header class="bar">
  <a class="brand" href="#temps" data-go="temps" aria-label="Air+, accueil">AIR<i>+</i></a>
  <nav class="nav" aria-label="Espaces">
    <button data-go="temps">Temps</button>
    <button data-go="pieces">Pièces</button>
    <button data-go="avion">Avion</button>
    <button data-go="equipe">Équipe</button>
    <button data-go="question">Question</button>
  </nav>
  <div class="bar-right">
    <span id="sessionBadge" class="flag hidden"></span>
    <button id="searchBtn" class="plain" aria-haspopup="dialog">Rechercher <kbd>Ctrl K</kbd></button>
    <button class="plain" data-go="sources">Sources</button>
  </div>
</header>
<main id="view"></main>
<aside id="sheet" class="sheet" aria-hidden="true" aria-label="Détail"><button class="close" data-close-sheet aria-label="Fermer">×</button><div id="sheetBody"></div></aside>
<aside id="drawer" class="drawer" aria-hidden="true"><button class="close" data-close-drawer aria-label="Fermer">×</button><div id="drawerBody"></div></aside>
<div id="palette" class="palette hidden" role="dialog" aria-modal="true" aria-label="Recherche"><div class="palette-box"><input id="paletteInput" type="search" placeholder="Poste, pièce, fournisseur, personne" aria-label="Rechercher" autocomplete="off"><div id="paletteList" role="listbox"></div></div></div>
<div id="tooltip" class="tooltip hidden" role="tooltip"></div>
<div id="toast" class="toast hidden" role="status"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
